# Same as iggy.yaml, but every topic is created with fsync on every message batch, so a
# publish acknowledgement means the batch is on disk. Use it for the durability cell next
# to iggy.yaml's default cell.

name: Iggy-fsync
driverClass: io.openmessaging.benchmark.driver.iggy.IggyBenchmarkDriver

host: 127.0.0.1
port: 8090
username: iggy
password: iggy
hosts: []

# Netty event loop threads shared by every connection of this worker. Omit for min(8, cores);
# 0 gives every connection its own single-thread loop (SDK default).
# ioThreads: 8

connectionTimeoutMs: 3000
requestTimeoutMs: 30000
retryPolicy: default
retryMaxRetries: 12
retryDelayMs: 5000

streamName: omb

# Acknowledgements are durability-gated only when messages_required_to_save is 1.
topicOptions:
  enforce_fsync: "true"
  messages_required_to_save: "1"

producerBatchSize: 1000
producerBatchBytes: 1048576
producerLingerMs: 1
producerMaxInFlightBatches: 16

consumerPollSize: 1000
