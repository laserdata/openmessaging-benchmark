name: Iggy
driverClass: io.openmessaging.benchmark.driver.iggy.IggyBenchmarkDriver

# TCP listener and credentials. `iggy-server --with-default-root-credentials` gives iggy/iggy.
host: 127.0.0.1
port: 8090
username: iggy
password: iggy

# Optional bootstrap list, `host:port` entries tried round-robin and fallen through on a
# failed dial or login. Overrides host/port when non-empty. Every login is redirected to the
# metadata leader by the SDK, so this only helps a run start when one node is down.
hosts: []

# Client timeouts. A dropped request is only noticed when requestTimeoutMs elapses.
# Netty event loop threads shared by every connection of this worker. Omit for min(8, cores);
# 0 gives every connection its own single-thread loop (SDK default).
# ioThreads: 8

connectionTimeoutMs: 3000
requestTimeoutMs: 30000

# Redial policy after a lost connection: default (SDK: 12 attempts 5 s apart), none,
# exponential, or fixed with retryMaxRetries attempts retryDelayMs apart.
retryPolicy: default
retryMaxRetries: 12
retryDelayMs: 5000

# Stream holding the benchmark topics. Created when missing.
streamName: omb

# Options passed at CreateTopic, keyed by server option name; values are strings the server
# parses. Empty means server defaults (enforce_fsync=false, messages_required_to_save=1024,
# segment_size=1GiB). See iggy-fsync.yaml for the durable cell.
topicOptions: {}

# A batch becomes ready at producerBatchSize messages, producerBatchBytes bytes of payload,
# or producerLingerMs after its first message. If sending is blocked, a partial batch can keep filling.
producerBatchSize: 1000
producerBatchBytes: 1048576
producerLingerMs: 1

# Batches a producer may have in flight before its send lane stops. Ready batches can still queue;
# this controls network concurrency, not accepted-data backpressure. 0 disables the cap.
producerMaxInFlightBatches: 16

# Bytes a producer can hold without acknowledgment before sendAsync blocks the load thread.
# The charge includes payloads and message headers across open, queued, and sent batches.
# A negative value reserves producerBatchBytes plus producerBatchSize headers for each allowed
# in-flight batch. With producerMaxInFlightBatches: 0 it resolves to 0. A resolved value of 0
# disables backpressure and can grow memory without bound under producerRate: 0.
# producerMaxPendingBytes: -1

# Threads shared by every producer for encoding and submitting batches. The linger timer only
# hands a batch to its producer's lane, so this is where the per-batch work runs.
# Omit for min(4, cores).
# producerFlushThreads: 4

# Maximum number of messages one poll asks for.
consumerPollSize: 1000

# With consumerAutoCommit: false, polls one consumer may have in flight, at most one per owned
# partition. 1 is the original one-at-a-time sweep, where a consumer owning P partitions revisits
# each once per P round trips. Server-cursor mode (consumerAutoCommit: true) always polls serially.
# consumerPollConcurrency: 1
