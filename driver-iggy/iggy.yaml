name: Iggy
driverClass: io.openmessaging.benchmark.driver.iggy.IggyBenchmarkDriver

# TCP listener and credentials. `iggy-server --with-default-root-credentials` gives iggy/iggy.
host: 127.0.0.1
port: 8090
username: iggy
password: iggy

# Stream holding the benchmark topics. Created when missing.
streamName: omb

# A producer batch is flushed when it reaches producerBatchSize messages or
# producerBatchBytes bytes of payload, or when producerLingerMs elapsed.
producerBatchSize: 1000
producerBatchBytes: 1048576
producerLingerMs: 1

# Maximum number of messages one poll asks for.
consumerPollSize: 1000
